<style>
  :root{
    --red:#C13A2A;
    --cream:#F7F3EE;
    --cream-2:#F1ECE3;
    --ink:#1A1A1A;
    --ink-60:#5B5751;
    --line:#E4DDD1;
    --ease: cubic-bezier(.2,.7,.3,1);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  h1{font-family:'Archivo Narrow',sans-serif;font-weight:700;letter-spacing:-0.01em;line-height:1.1;margin:0;}
  p{margin:0;line-height:1.6;color:var(--ink-60);}
  a{color:inherit;text-decoration:none;}
  a:hover{color:var(--red);}

  .wrap{max-width:420px;padding:24px;text-align:center;}
  .inner{
    opacity:0;transform:translateY(10px);
    animation:settle .6s var(--ease) forwards;
  }
  @keyframes settle{to{opacity:1;transform:translateY(0);}}

  .mark{width:44px;height:44px;margin:0 auto 24px;}
  .mark img{width:100%;height:100%;object-fit:contain;}

  .check{
    width:64px;height:64px;margin:0 auto 20px;
    color:var(--red);
  }

  h1{font-size:clamp(28px,6vw,36px);margin-bottom:14px;}
  .sub{font-size:16px;margin-bottom:32px;}

  .details{
    background:var(--cream-2);border-radius:16px;
    padding:22px 24px;text-align:left;margin-bottom:28px;
  }
  .details-title{font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:10px;text-transform:uppercase;letter-spacing:0.04em;}
  .details p{font-size:14px;color:var(--ink-60);line-height:1.6;}

  .phone-line{font-size:14px;color:var(--ink-60);}
  .phone-line a{font-weight:600;color:var(--ink);}
